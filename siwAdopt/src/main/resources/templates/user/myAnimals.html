<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>I tuoi annunci</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body class="my-animals-page">
 <div class="animals-wrapper">
  <h1>I tuoi annunci</h1>

  <!-- Scroll solo sulla lista -->
  <div class="animals-scroll">
    <div th:if="${#lists.isEmpty(animali)}">
      <p>Non hai ancora pubblicato annunci.</p>
    </div>

    <ul th:if="${!#lists.isEmpty(animali)}">
      <li th:each="animale, iterStat : ${animali}">
        Annuncio n. [[${iterStat.index + 1}]] – Nome: [[${animale.nome}]], Genere: [[${animale.genere}]], Età: [[${animale.eta}]]
      </li>
    </ul>
  </div>

  <!-- Bottone in fondo -->
  <a th:href="@{/user/indexU}">Torna alla Home</a>
</div>

</body>
</html>
